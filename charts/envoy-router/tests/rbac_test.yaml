suite: RBAC
release:
  namespace: test-ns

tests:
  - it: Role is cluster-scoped (ClusterRole)
    template: templates/role.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - notExists:
          path: metadata.namespace

  - it: RoleBinding is cluster-scoped (ClusterRoleBinding)
    template: templates/rolebinding.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - notExists:
          path: metadata.namespace

  - it: ClusterRoleBinding references ClusterRole
    template: templates/rolebinding.yaml
    asserts:
      - equal:
          path: roleRef.kind
          value: ClusterRole

  - it: ClusterRoleBinding subject namespace matches release namespace
    template: templates/rolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].namespace
          value: test-ns

  - it: ClusterRole grants required verbs on pods
    template: templates/role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "update", "patch"]

  - it: ClusterRole grants full CRUD on httproutes
    template: templates/role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.k8s.io"]
            resources: ["httproutes"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: ClusterRole grants full CRUD on services
    template: templates/role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["services"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: ClusterRole grants full CRUD on endpointslices
    template: templates/role.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
