  <line x1="8" y1="50" x2="37" y2="50" stroke="#00b4a0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="72" x2="39" y2="56" stroke="#00b4a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrowheads -->
