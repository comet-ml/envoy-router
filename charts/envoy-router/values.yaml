replicaCount: 1

image:
  repository: ghcr.io/comet-ml/envoy-router
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

# Gateway resource created in the same namespace as the operator.
# Uses the "eg" GatewayClass that Envoy Gateway installs automatically.
gateway:
  # createClass: create the GatewayClass (cluster-scoped, only needed once per cluster)
  createClass: true
  create: true
  className: envoy-router
  name: envoy-router
  port: 80
  # Same: only HTTPRoutes from this namespace attach (per-namespace model)
  allowedRouteNamespaces: Same

operator:
  gatewayName: envoy-router
  servicePort: 80
  podPort: 8080
  # watchNamespace restricts the operator to a single namespace.
  # Empty (default) watches all namespaces; set to the release namespace for
  # a single-namespace isolated deployment.
  watchNamespace: ""

# Envoy Gateway sub-chart — installs the EG controller alongside the operator.
# Set enabled: false if you manage Envoy Gateway separately (e.g. a shared cluster-wide install).
envoy-gateway:
  enabled: true
  createNamespace: false
  config:
    envoyGateway:
      gateway:
        # Must match the controllerName in the GatewayClass created by this chart.
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
      logging:
        level:
          default: info
  deployment:
    replicas: 1
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1024Mi

metrics:
  serviceMonitor:
    enabled: false
    # namespace: monitoring  # defaults to release namespace
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
