{{- $gwName := index .Values "envoy-router" "gateway" "name" }}
{{- $gwPort := index .Values "envoy-router" "gateway" "port" | int }}
# Service in envoy-gateway-system that selects the Envoy proxy pods.
# Envoy Gateway runs proxy pods in envoy-gateway-system; a Service can only
# select pods in its own namespace, so this must live here.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-envoy-proxy
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Name }}
spec:
  selector:
    gateway.envoyproxy.io/owning-gateway-name: {{ $gwName }}
    gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
  ports:
  - name: http
    port: {{ $gwPort }}
    # Envoy Gateway maps listener port 80 → 10080 internally (non-root container)
    targetPort: {{ add $gwPort 10000 }}
    protocol: TCP
