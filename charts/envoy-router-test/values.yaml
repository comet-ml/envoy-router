# Test pods to create. Each becomes pp-<name>, routable at /<name>.
pods:
  - name: aaa
  - name: bbb
  - name: ccc

# Port the test pods listen on
podPort: 8080

# HTTP echo image — responds with the pod name
image:
  repository: hashicorp/http-echo
  tag: latest

# Ingress — internal ALB forwarding the test domain to the Envoy proxy
ingress:
  host: test-pp.dev.comet.com

# envoy-router subchart values
envoy-router:
  image:
    repository: ghcr.io/comet-ml/envoy-router
    tag: ""
  gateway:
    createClass: true
    create: true
    className: envoy-router
    name: envoy-router
    port: 80
    allowedRouteNamespaces: Same
  operator:
    gatewayName: envoy-router
    servicePort: 80
    podPort: 8080
